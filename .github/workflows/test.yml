name: Test

on: [push, pull_request]

# Cancel superseded runs for the same branch or PR.
concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

# No permissions by default; each job asks for what it needs.
permissions: {}

jobs:
    lint:
        name: Lint PHP and check PHP compatibility
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

            - name: Setup PHP and Composer
              uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
              with:
                php-version: '8.3'

            - name: Install Composer dependencies
              run: composer install --no-interaction --prefer-dist

            # phpcs.xml.dist layers WordPress-Extra, WordPress-VIP-Go and
            # PHPCompatibilityWP with testVersion 7.2-, so this one command covers
            # both coding standards and the PHP floor.
            - name: PHPCS
              run: composer lint

    test:
        name: PHP ${{ matrix.php }} / WP ${{ matrix.wp }}
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                # Explicit pairs rather than a cross product. Current WordPress
                # does not run on the oldest PHP the plugin supports, so the
                # 7.2 floor is exercised against a pinned older release — the
                # same split the parent Two Factor plugin uses.
                #
                # `multisite: true` marks the one leg that also runs
                # tests/multisite/. It is not part of any cross product either:
                # network behavior does not depend on the PHP or WordPress
                # version in a way the rest of this matrix is designed to
                # catch, so running it once, on a current PHP against a
                # current stable WordPress, is enough coverage without
                # materially lengthening every other leg.
                include:
                    - { php: '8.3', wp: 'trunk' }
                    - { php: '8.3', wp: 'latest', multisite: true }
                    - { php: '8.1', wp: 'latest' }
                    - { php: '7.4', wp: 'latest' }
                    - { php: '7.2', wp: '6.9' }

        env:
            WP_ENV_PHP_VERSION: ${{ matrix.php }}
            # Must never be empty: wp-env cannot resolve a core source from an
            # empty string, and docker compose fails before any plugin is activated.
            WP_ENV_CORE: ${{ matrix.wp == 'trunk' && 'WordPress/WordPress' || format( 'https://wordpress.org/wordpress-{0}.zip', matrix.wp ) }}

        steps:
            - name: Checkout
              uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

            - name: Setup Node
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
              with:
                node-version: '24'
                check-latest: true
                cache: 'npm'

            - name: Install NPM dependencies
              run: npm install

            # wp-env pulls WordPress and the Two Factor plugin from the network,
            # which is the flakiest step in this workflow, so retry it.
            - name: Start the Docker environment
              uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
              with:
                timeout_minutes: 10
                max_attempts: 3
                command: npm run env start

            # Install inside the container so the lock resolves against the
            # matrix PHP version rather than the runner's.
            - name: Composer install
              run: |
                rm -f composer.lock
                npm run composer install

            # Runs both suites: the main one, and the no-dependency suite that
            # asserts the plugin no-ops when Two Factor is absent. Deliberately
            # not `npm test` (composer's aggregate "test" script), which also
            # includes the multisite suite — that runs as its own step below,
            # gated to a single matrix leg, so it does not triple the runtime
            # of every other leg.
            - name: PHPUnit
              run: npm run composer test:standard

            # Network behavior (enrollment gate, onboarding marker, uninstall)
            # verified against a real multisite install — see
            # phpunit-multisite.xml.dist and tests/multisite/. Runs once, on
            # this matrix's current-PHP/current-WordPress leg, rather than on
            # every leg.
            - name: PHPUnit (multisite)
              if: ${{ matrix.multisite == true }}
              run: npm run composer test:multisite

            - name: Environment logs on failure
              if: failure()
              run: npm run env logs all -- --no-watch || true

    dist:
        name: Build and verify the distributable plugin
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

            - name: Setup Node
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
              with:
                node-version: '24'
                check-latest: true
                cache: 'npm'

            - name: Install NPM dependencies
              run: npm install

            - name: Build dist/
              run: npm run build

            # A full file-list comparison, not a spot check: catches a file
            # that quietly ends up in dist/ (a stale .distignore rule, a new
            # source file nobody remembered to exclude) before it ships.
            - name: Verify dist/ file list
              run: npm run verify:dist

            # wp-env pulls WordPress and the Two Factor plugin from the network,
            # which is the flakiest step in this workflow, so retry it.
            - name: Start the Docker environment
              uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
              with:
                timeout_minutes: 10
                max_attempts: 3
                command: npm run env start

            # Installs dist/ into the environment under its own plugin slug and
            # activates it alongside Two Factor, proving the built artifact
            # genuinely works rather than merely containing the right
            # filenames. Also asserts activation is refused when attempted
            # before Two Factor is active — two-factor-enrollment.php declares
            # `Requires Plugins: two-factor`, and wrong activation order is
            # exactly the class of bug .wp-env.json's plugin order once had,
            # which the PHPUnit suites cannot catch because tests/bootstrap.php
            # requires the plugin files directly rather than activating them.
            - name: Verify dist/ activates
              run: npm run verify:dist:activation

            - name: Environment logs on failure
              if: failure()
              run: npm run env logs all -- --no-watch || true
